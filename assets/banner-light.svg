      <path stroke="#ded2f8" stroke-opacity="0.95" d="M772 24h12m20 -16h12m-12 32h12m4 -16h12m-12 48h12m4 -64h12m4 0h12m-12 16h12m-12 32h12m-12 48h12m4 -80h12m-12 48h12m-12 32h12m4 -96h12m-12 48h12m-12 16h12m4 -48h12m-12 32h12m-12 16h12m-12 32h12m4 -96h12m-12 48h12m-12 16h12m-12 16h12m-12 16h12m4 -96h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m4 -80h12m-12 16h12m-12 32h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m4 -112h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m4 -128h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m4 -112h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m4 -128h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m4 -128h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m4 -128h12m-12 112h12m-12 16h12m4 -128h12m-12 16h12m4 112h12"/>
