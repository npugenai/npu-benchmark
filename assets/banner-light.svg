<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">NPU Benchmark</title>
  <desc id="desc">Stable Diffusion endurance test on AMD Ryzen AI NPU. XDNA2, RyzenAI 1.7.1, 5 SD models, VitisAI EP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1625"/>
      <stop offset="1" stop-color="#2d2a47"/>
    </linearGradient>
    <radialGradient id="halo" cx="1030" cy="160" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a18cd1" stop-opacity=".30"/>
      <stop offset="1" stop-color="#a18cd1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="640" y1="0" x2="848" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a18cd1" stop-opacity="0"/>
      <stop offset="1" stop-color="#a18cd1" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eeff"/>
      <stop offset=".55" stop-color="#c7b6f0"/>
      <stop offset="1" stop-color="#9d84d8"/>
    </linearGradient>
    <linearGradient id="pkg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2546"/>
      <stop offset="1" stop-color="#201b35"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#d1c4e9"/>
    </pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1280" height="320" fill="url(#fadeL)"/></mask>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>

    <!-- one AIE compute tile: core + local memory -->
    <g id="tile">
      <rect x=".5" y=".5" width="29" height="29" rx="5" fill="#29233f" stroke="#463d6b"/>
      <rect x="6.5" y="6.5" width="9" height="9" rx="2" fill="none" stroke="#574c84"/>
      <path d="M6 22.5h18M6 25.5h11" stroke="#463d6b"/>
    </g>
    <g id="row">
      <use href="#tile"/><use href="#tile" x="38"/><use href="#tile" x="76"/><use href="#tile" x="114"/>
      <use href="#tile" x="152"/><use href="#tile" x="190"/><use href="#tile" x="228"/><use href="#tile" x="266"/>
    </g>
    <!-- an active tile -->
    <g id="on">
      <rect x="-2" y="-2" width="34" height="34" rx="6" fill="#a18cd1" filter="url(#blur)"/>
      <rect width="30" height="30" rx="5" fill="url(#hot)"/>
      <rect x="6.5" y="6.5" width="9" height="9" rx="2" fill="#fff" fill-opacity=".55"/>
      <path d="M6 22.5h18M6 25.5h11" stroke="#6f58ad" stroke-opacity=".6"/>
    </g>
    <rect id="warm" x=".5" y=".5" width="29" height="29" rx="5"/>
    <rect id="mem" width="30" height="14" rx="3" fill="#231e38" stroke="#463d6b"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)" opacity=".16" mask="url(#dotMask)"/>
    <circle cx="1030" cy="160" r="250" fill="url(#halo)"/>

    <!-- board traces into the package -->
    <g fill="none" stroke="url(#trace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M848 92H798L776 70H704"/>
      <path d="M848 132H736"/>
      <path d="M848 212H806L786 232H748"/>
      <path d="M848 252H798L776 274H716"/>
      <circle cx="704" cy="70" r="3.5"/>
      <circle cx="736" cy="132" r="3.5"/>
      <circle cx="748" cy="232" r="3.5"/>
      <circle cx="716" cy="274" r="3.5"/>
    </g>
    <g fill="none" stroke="#a18cd1" stroke-opacity=".22" stroke-width="2">
      <path d="M922 35V0M982 35V12L994 0M1082 35V0M1142 35V14L1156 0"/>
      <path d="M942 285V320M1022 285V306L1036 320M1102 285V320M1162 285V320"/>
      <path d="M1212 92H1280M1212 152H1238L1254 136H1280M1212 232H1280"/>
    </g>

    <!-- package -->
    <g transform="translate(858 45)">
      <g stroke="#8a73b8" stroke-opacity=".7" stroke-width="10" stroke-dasharray="4 16">
        <path d="M-5 25V209M349 25V209M22 -5H326M22 235H326"/>
      </g>
      <rect width="344" height="230" rx="16" fill="url(#pkg)" stroke="#8a73b8" stroke-opacity=".55" stroke-width="1.5"/>
      <rect x="10" y="10" width="324" height="210" rx="10" fill="#15121f" stroke="#a18cd1" stroke-opacity=".25"/>
      <circle cx="22" cy="22" r="3" fill="#a18cd1" opacity=".55"/>

      <!-- 8 x 4 compute tiles -->
      <g transform="translate(24 24)">
        <use href="#row"/>
        <use href="#row" y="38"/>
        <use href="#row" y="76"/>
        <use href="#row" y="114"/>

        <!-- activity: faint / warm / hot -->
        <g fill="#8a73b8" fill-opacity=".22" stroke="#a18cd1" stroke-opacity=".25">
          <rect x="38" width="30" height="30" rx="5"/>
          <rect x="190" width="30" height="30" rx="5"/>
          <rect x="76" y="38" width="30" height="30" rx="5"/>
          <rect x="228" y="38" width="30" height="30" rx="5"/>
          <rect x="114" y="76" width="30" height="30" rx="5"/>
          <rect x="266" y="76" width="30" height="30" rx="5"/>
          <rect x="152" y="114" width="30" height="30" rx="5"/>
          <rect y="114" width="30" height="30" rx="5"/>
        </g>
        <g fill="#a18cd1" fill-opacity=".5" stroke="#d1c4e9" stroke-opacity=".45">
          <use href="#warm" x="76"/>
          <use href="#warm" x="152"/>
          <use href="#warm" x="114" y="38"/>
          <use href="#warm" x="190" y="38"/>
          <use href="#warm" x="152" y="76"/>
          <use href="#warm" x="228" y="76"/>
          <use href="#warm" x="190" y="114"/>
          <use href="#warm" x="266" y="114"/>
          <use href="#warm" y="76"/>
        </g>
        <use href="#on" x="114"><animate attributeName="opacity" values="1;.55;1" dur="3.6s" repeatCount="indefinite"/></use>
        <use href="#on" x="152" y="38"><animate attributeName="opacity" values="1;.55;1" dur="3.6s" begin=".45s" repeatCount="indefinite"/></use>
        <use href="#on" x="190" y="76"><animate attributeName="opacity" values="1;.55;1" dur="3.6s" begin=".9s" repeatCount="indefinite"/></use>
        <use href="#on" x="228" y="114"><animate attributeName="opacity" values="1;.55;1" dur="3.6s" begin="1.35s" repeatCount="indefinite"/></use>
        <use href="#on" x="38" y="114"><animate attributeName="opacity" values="1;.55;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></use>

        <!-- memory tiles + interface row -->
        <g transform="translate(0 152)">
          <use href="#mem"/><use href="#mem" x="38"/><use href="#mem" x="76"/><use href="#mem" x="114"/>
          <use href="#mem" x="152"/><use href="#mem" x="190"/><use href="#mem" x="228"/><use href="#mem" x="266"/>
          <path d="M120 7h18M158 7h18M196 7h18M234 7h18" stroke="#a18cd1" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
        </g>
        <rect y="174" width="296" height="8" rx="3" fill="#3a3260"/>
        <path d="M15 178H281" stroke="#a18cd1" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 6"/>
      </g>
    </g>

    <!-- copy -->
    <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
      <g transform="translate(60 58)">
        <rect width="9" height="9" rx="2" fill="#a18cd1"/>
        <rect x="12" width="9" height="9" rx="2" fill="#a18cd1" fill-opacity=".35"/>
        <rect y="12" width="9" height="9" rx="2" fill="#a18cd1" fill-opacity=".35"/>
        <rect x="12" y="12" width="9" height="9" rx="2" fill="#a18cd1" fill-opacity=".35"/>
      </g>
      <text x="94" y="76" font-size="20" letter-spacing="4" fill="#a18cd1">NPU GENAI<tspan fill="#8f87aa"> · OPEN SOURCE</tspan></text>
    </g>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="56" y="158" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#f5f1ff"><tspan fill="#a18cd1">NPU</tspan> Benchmark</text>
      <text x="60" y="202" font-size="25" fill="#bdb5d4">Stable Diffusion endurance test on <tspan fill="#e6defa" font-weight="600">AMD Ryzen AI NPU</tspan></text>
    </g>

    <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" text-anchor="middle">
      <rect x="60" y="226" width="96" height="36" rx="18" fill="#a18cd1"/>
      <text x="108" y="251" font-weight="700" fill="#1a1625">XDNA2</text>
      <g fill="#a18cd1" fill-opacity=".1" stroke="#a18cd1" stroke-opacity=".5">
        <rect x="168" y="226.5" width="186" height="35" rx="17.5"/>
        <rect x="366" y="226.5" width="162" height="35" rx="17.5"/>
        <rect x="540" y="226.5" width="150" height="35" rx="17.5"/>
      </g>
      <g fill="#d1c4e9">
        <text x="261" y="251">RyzenAI 1.7.1</text>
        <text x="447" y="251">5 SD models</text>
        <text x="615" y="251">VitisAI EP</text>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1278.5" height="318.5" rx="23.25" fill="none" stroke="#a18cd1" stroke-opacity=".22" stroke-width="1.5"/>
</svg>
