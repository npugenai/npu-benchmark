  <text x="64" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#5f5a78">Stable Diffusion endurance test on AMD Ryzen AI NPU</text>

