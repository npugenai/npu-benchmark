<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">NPU Benchmark</title>
  <desc id="d">Stable Diffusion endurance test on AMD Ryzen AI NPU. XDNA2, RyzenAI 1.7.1, VitisAI EP, 5 SD models. Artwork: a pixel latent denoising from random noise into a moonlit landscape.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfbff"/>
      <stop offset="1" stop-color="#efe9fb"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>

    <!-- target image -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e3d8fa"/>
      <stop offset="1" stop-color="#b7a1ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="1088" cy="100" r="212" gradientUnits="userSpaceOnUse">
      <stop offset="0.20" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ebff"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="150" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b3a0e3"/><stop offset="1" stop-color="#a691dc"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="200" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#937dd0"/><stop offset="1" stop-color="#8670c4"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="260" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7660b0"/><stop offset="1" stop-color="#6551a0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- the image resolves from left to right -->
    <linearGradient id="reveal" x1="900" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <style>
      .tw1 { animation: tw1 4.6s ease-in-out infinite }
      .tw2 { animation: tw2 6.8s ease-in-out infinite }
      .pulse { animation: pulse 9s ease-in-out infinite }
      @keyframes tw1 { 50% { opacity: .35 } }
      @keyframes tw2 { 50% { opacity: .45 } }
      @keyframes pulse { 50% { opacity: .7 } }
      @media (prefers-reduced-motion: reduce) { .tw1, .tw2, .pulse { animation: none } }
    </style>
    <mask id="resolve"><rect width="1280" height="320" fill="url(#reveal)"/></mask>
    <linearGradient id="npu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b5cc9"/>
      <stop offset="1" stop-color="#a18cd1"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>

    <!-- clean image (t = 0) -->
    <g mask="url(#resolve)">
      <rect x="640" width="640" height="320" fill="url(#sky)"/>
      <rect class="pulse" x="640" width="640" height="320" fill="url(#glow)"/>
      <circle cx="1088" cy="100" r="42" fill="url(#moon)"/>
