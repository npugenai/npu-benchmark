<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">NPU Benchmark</title>
  <desc id="desc">Stable Diffusion endurance test on AMD Ryzen AI NPU. XDNA2, RyzenAI 1.7.1, 5 SD models, VitisAI EP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfcff"/>
      <stop offset="1" stop-color="#eee8fa"/>
    </linearGradient>
    <radialGradient id="halo" cx="1030" cy="160" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a18cd1" stop-opacity=".30"/>
      <stop offset="1" stop-color="#a18cd1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="640" y1="0" x2="848" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a73b8" stop-opacity="0"/>
      <stop offset="1" stop-color="#8a73b8" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3b0f2"/>
      <stop offset="1" stop-color="#7a5cd0"/>
    </linearGradient>
    <linearGradient id="pkg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f0fc"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#8a73b8"/>
    </pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1280" height="320" fill="url(#fadeL)"/></mask>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>

    <!-- one AIE compute tile: core + local memory -->
    <g id="tile">
      <rect x=".5" y=".5" width="29" height="29" rx="5" fill="#ffffff" stroke="#d9cff0"/>
      <rect x="6.5" y="6.5" width="9" height="9" rx="2" fill="none" stroke="#c9bbe8"/>
      <path d="M6 22.5h18M6 25.5h11" stroke="#ddd4f1"/>
    </g>
    <g id="row">
      <use href="#tile"/><use href="#tile" x="38"/><use href="#tile" x="76"/><use href="#tile" x="114"/>
      <use href="#tile" x="152"/><use href="#tile" x="190"/><use href="#tile" x="228"/><use href="#tile" x="266"/>
    </g>
    <!-- an active tile -->
    <g id="on">
      <rect x="-2" y="-2" width="34" height="34" rx="6" fill="#9b80e0" fill-opacity=".85" filter="url(#blur)"/>
      <rect width="30" height="30" rx="5" fill="url(#hot)"/>
      <rect x="6.5" y="6.5" width="9" height="9" rx="2" fill="#fff" fill-opacity=".8"/>
      <path d="M6 22.5h18M6 25.5h11" stroke="#fff" stroke-opacity=".6"/>
    </g>
    <rect id="warm" x=".5" y=".5" width="29" height="29" rx="5"/>
    <rect id="mem" x=".5" y=".5" width="29" height="13" rx="3" fill="#faf8fe" stroke="#d9cff0"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)" opacity=".28" mask="url(#dotMask)"/>
    <circle cx="1030" cy="160" r="260" fill="url(#halo)"/>

    <!-- board traces into the package -->
    <g fill="none" stroke="url(#trace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M848 92H798L776 70H704"/>
      <path d="M848 132H736"/>
      <path d="M848 212H806L786 232H748"/>
      <path d="M848 252H798L776 274H716"/>
      <circle cx="704" cy="70" r="3.5" fill="#fff"/>
      <circle cx="736" cy="132" r="3.5" fill="#fff"/>
      <circle cx="748" cy="232" r="3.5" fill="#fff"/>
      <circle cx="716" cy="274" r="3.5" fill="#fff"/>
    </g>
    <g fill="none" stroke="#8a73b8" stroke-opacity=".28" stroke-width="2">
      <path d="M922 35V0M982 35V12L994 0M1082 35V0M1142 35V14L1156 0"/>
      <path d="M942 285V320M1022 285V306L1036 320M1102 285V320M1162 285V320"/>
      <path d="M1212 92H1280M1212 152H1238L1254 136H1280M1212 232H1280"/>
    </g>

    <!-- package -->
    <g transform="translate(858 45)">
      <rect x="12" y="22" width="320" height="216" rx="18" fill="#5b3fa6" opacity=".22" filter="url(#shadow)"/>
      <g stroke="#a593d4" stroke-width="10" stroke-dasharray="4 16">
        <path d="M-5 25V209M349 25V209M22 -5H326M22 235H326"/>
      </g>
      <rect width="344" height="230" rx="16" fill="url(#pkg)" stroke="#bfb0e3" stroke-width="1.5"/>
      <rect x="10" y="10" width="324" height="210" rx="10" fill="#f1ecfb" stroke="#ded5f2"/>
      <circle cx="22" cy="22" r="3" fill="#8a73b8" opacity=".6"/>

      <!-- 8 x 4 compute tiles -->
      <g transform="translate(24 24)">
        <use href="#row"/>
        <use href="#row" y="38"/>
        <use href="#row" y="76"/>
        <use href="#row" y="114"/>

        <!-- activity: faint / warm / hot -->
        <g fill="#8f6fe0" fill-opacity=".1" stroke="#a18cd1" stroke-opacity=".4">
          <rect x="38.5" y=".5" width="29" height="29" rx="5"/>
          <rect x="190.5" y=".5" width="29" height="29" rx="5"/>
          <rect x="76.5" y="38.5" width="29" height="29" rx="5"/>
          <rect x="228.5" y="38.5" width="29" height="29" rx="5"/>
          <rect x="114.5" y="76.5" width="29" height="29" rx="5"/>
          <rect x="266.5" y="76.5" width="29" height="29" rx="5"/>
          <rect x="152.5" y="114.5" width="29" height="29" rx="5"/>
          <rect x=".5" y="114.5" width="29" height="29" rx="5"/>
        </g>
        <g fill="#8f6fe0" fill-opacity=".3" stroke="#8a73b8" stroke-opacity=".55">
          <use href="#warm" x="76"/>
          <use href="#warm" x="152"/>
          <use href="#warm" x="114" y="38"/>
          <use href="#warm" x="190" y="38"/>
          <use href="#warm" x="152" y="76"/>
          <use href="#warm" x="228" y="76"/>
          <use href="#warm" x="190" y="114"/>
          <use href="#warm" x="266" y="114"/>
          <use href="#warm" y="76"/>
        </g>
        <use href="#on" x="114"><animate attributeName="opacity" values="1;.6;1" dur="3.6s" repeatCount="indefinite"/></use>
        <use href="#on" x="152" y="38"><animate attributeName="opacity" values="1;.6;1" dur="3.6s" begin=".45s" repeatCount="indefinite"/></use>
        <use href="#on" x="190" y="76"><animate attributeName="opacity" values="1;.6;1" dur="3.6s" begin=".9s" repeatCount="indefinite"/></use>
        <use href="#on" x="228" y="114"><animate attributeName="opacity" values="1;.6;1" dur="3.6s" begin="1.35s" repeatCount="indefinite"/></use>
        <use href="#on" x="38" y="114"><animate attributeName="opacity" values="1;.6;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></use>

        <!-- memory tiles + interface row -->
        <g transform="translate(0 152)">
          <use href="#mem"/><use href="#mem" x="38"/><use href="#mem" x="76"/><use href="#mem" x="114"/>
          <use href="#mem" x="152"/><use href="#mem" x="190"/><use href="#mem" x="228"/><use href="#mem" x="266"/>
          <path d="M120 7h18M158 7h18M196 7h18M234 7h18" stroke="#8a73b8" stroke-width="2" stroke-linecap="round"/>
        </g>
        <rect y="174" width="296" height="8" rx="3" fill="#e0d7f4"/>
        <path d="M15 178H281" stroke="#8a73b8" stroke-opacity=".6" stroke-width="2" stroke-dasharray="2 6"/>
      </g>
    </g>

    <!-- copy -->
    <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
      <g transform="translate(60 58)">
        <rect width="9" height="9" rx="2" fill="#7a5cd0"/>
        <rect x="12" width="9" height="9" rx="2" fill="#7a5cd0" fill-opacity=".3"/>
        <rect y="12" width="9" height="9" rx="2" fill="#7a5cd0" fill-opacity=".3"/>
        <rect x="12" y="12" width="9" height="9" rx="2" fill="#7a5cd0" fill-opacity=".3"/>
      </g>
      <text x="94" y="76" font-size="20" letter-spacing="4" fill="#6b4fc4">NPU GENAI<tspan fill="#77718e"> · OPEN SOURCE</tspan></text>
    </g>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="56" y="158" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#1d1830"><tspan fill="#7356cc">NPU</tspan> Benchmark</text>
      <text x="60" y="202" font-size="25" fill="#4f4968">Stable Diffusion endurance test on <tspan fill="#251f3b" font-weight="600">AMD Ryzen AI NPU</tspan></text>
    </g>

    <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" text-anchor="middle">
      <rect x="60" y="226" width="96" height="36" rx="18" fill="#7356cc"/>
      <text x="108" y="251" font-weight="700" fill="#ffffff">XDNA2</text>
      <g fill="#ffffff" fill-opacity=".85" stroke="#c9bbe8">
        <rect x="168" y="226.5" width="186" height="35" rx="17.5"/>
        <rect x="366" y="226.5" width="162" height="35" rx="17.5"/>
        <rect x="540" y="226.5" width="150" height="35" rx="17.5"/>
      </g>
      <g fill="#5a4790">
        <text x="261" y="251">RyzenAI 1.7.1</text>
        <text x="447" y="251">5 SD models</text>
        <text x="615" y="251">VitisAI EP</text>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1278.5" height="318.5" rx="23.25" fill="none" stroke="#8a73b8" stroke-opacity=".25" stroke-width="1.5"/>
</svg>
